<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#3478de"><title>Sudoku — a little daily clarity</title><script>
(()=>{let preference=null;try{preference=localStorage.getItem('sudoku-dark');}catch{}const dark=preference===null?matchMedia('(prefers-color-scheme: dark)').matches:preference==='true';document.documentElement.classList.toggle('dark',dark);document.querySelector('meta[name="theme-color"]').content=dark?'#111923':'#3478de';})();
</script><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sudoku"></head>
<body>
<header class="header"><a class="brand" href="./" aria-label="Sudoku home"><span class="brand-icon">▦</span> sudoku<span class="brand-dot">.</span></a><select id="language" class="language" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option><option value="nl">Nederlands</option></select><button id="theme" class="icon-button" aria-label="Toggle dark mode">☾</button></header>
<main>
<section class="game-layout" aria-label="Sudoku game">
<div class="board-column"><div class="game-meta"><label>Difficulty <select id="difficulty"><option value="Easy">Easy</option><option value="Medium" selected>Medium</option><option value="Hard">Hard</option><option value="Expert">Expert</option></select></label><div class="stats"><span>Mistakes <strong id="mistakes">0</strong><span class="muted">/ 3</span></span><span class="timer" id="timer">00:00</span><button id="pause" class="pause" aria-label="Pause game">Ⅱ</button></div></div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Sudoku puzzle"></div><button id="resume" class="resume" hidden><span>Ⅱ</span>Game paused<small>Click to keep playing</small></button></div></div>
<aside class="controls"><button id="new-game" class="new-game">New game <span>＋</span></button><div class="tools"><button id="undo"><span class="tool-icon">↶</span>Undo</button><button id="erase"><span class="tool-icon">⌫</span>Erase</button><button id="notes" aria-pressed="false"><span class="tool-icon">✎<b id="notes-badge">OFF</b></span>Notes</button><button id="quick-notes"><span class="tool-icon" aria-hidden="true">▦</span>Quick notes</button><button id="hint"><span class="tool-icon" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-1 .7-1.5 1.6-1.5 3.5h-4c0-1.9-.5-2.8-1.5-3.5Z"/></svg></span>Hint</button></div><div id="numpad" class="numpad" aria-label="Number pad"></div><section id="hint-panel" class="hint-panel" aria-labelledby="hint-title" hidden><div class="hint-heading"><strong id="hint-title"></strong><button id="hint-close" aria-label="Dismiss hint">×</button></div><p id="hint-text" role="status"></p><button id="hint-apply" class="hint-apply"></button></section></aside>
</section>

</main><div id="toast" class="toast" role="status"></div><dialog id="auto-complete-dialog" aria-labelledby="auto-complete-title" aria-describedby="auto-complete-text"><h2 id="auto-complete-title">Finish the puzzle?</h2><p id="auto-complete-text">Every remaining square has only one possible number. Would you like to auto-complete?</p><button id="auto-complete-yes" class="new-game">Yes, auto-complete</button><button id="auto-complete-no" class="text-button">No, keep playing</button></dialog><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><button id="dialog-action" class="new-game">Play again</button><button id="dialog-close" class="text-button">Keep viewing board</button></dialog><script src="languages.js"></script><script src="logic.js"></script><script src="puzzles.js"></script><script src="script.js"></script><script src="pwa.js"></script></body></html>
